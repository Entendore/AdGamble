<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description"
    content="Free-to-play narrative prediction markets. Earn chips by watching ads — never buy with real money.">
  <title>WagerTale — Free Narrative Prediction Markets</title>
  <link rel="manifest"
    href='data:application/manifest+json,{"name":"WagerTale","short_name":"WagerTale","start_url":".","display":"standalone","background_color":"%2309090f","theme_color":"%2309090f","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2309090f%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22%2300d26a%22/></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
  <style>
    :root {
      --bg: #09090f;
      --bg2: #111119;
      --bg3: #191924;
      --bg4: #22222f;
      --brd: #252535;
      --brd2: #333348;
      --tx: #e8e8f0;
      --tx2: #9898b0;
      --tx3: #606078;
      --yes: #00d26a;
      --yes2: rgba(0, 210, 106, .12);
      --yes3: rgba(0, 210, 106, .25);
      --no: #ff4466;
      --no2: rgba(255, 68, 102, .12);
      --no3: rgba(255, 68, 102, .25);
      --acc: #5b8def;
      --acc2: rgba(91, 141, 239, .15);
      --gold: #f0b800;
      --gold2: rgba(240, 184, 0, .12);
      --purple: #a855f7;
      --purple2: rgba(168, 85, 247, .12);
      --r: 10px;
      --rl: 14px;
      --tap: 44px;
      --sb: env(safe-area-inset-bottom, 0px);
      --st: env(safe-area-inset-top, 0px)
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }

      .ot-t,
      .ticker-track {
        animation: none !important
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      height: 100%;
      overflow: hidden
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit
    }

    input {
      font-family: inherit
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(8px + var(--st)) 12px 8px;
      border-bottom: 1px solid var(--brd);
      background: var(--bg);
      z-index: 10;
      flex-shrink: 0;
      gap: 6px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 14px;
      flex-shrink: 0
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--yes);
      box-shadow: 0 0 8px var(--yes);
      animation: pulse 2s ease-in-out infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }

    .ftp {
      background: var(--yes2);
      color: var(--yes);
      font-size: 8px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: .5px;
      border: 1px solid rgba(0, 210, 106, .3)
    }

    .bal-area {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0
    }

    .bal-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg3);
      border: 1px solid var(--brd);
      padding: 5px 6px 5px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      font-variant-numeric: tabular-nums
    }

    .earn-btn {
      background: linear-gradient(135deg, var(--yes), #00a854);
      color: #000;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      border: none;
      position: relative
    }

    .earn-btn::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid var(--yes);
      opacity: .4;
      animation: ep 2s ease-in-out infinite
    }

    @keyframes ep {

      0%,
      100% {
        transform: scale(1);
        opacity: .4
      }

      50% {
        transform: scale(1.15);
        opacity: 0
      }
    }

    .streak-b {
      background: linear-gradient(135deg, var(--gold), #ff8800);
      color: #000;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px
    }

    .top-icons {
      display: flex;
      gap: 4px;
      align-items: center
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg3);
      border: 1px solid var(--brd);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--tx2)
    }

    .ot {
      background: var(--bg2);
      border-bottom: 1px solid var(--brd);
      padding: 6px 0;
      overflow: hidden;
      flex-shrink: 0;
      position: relative
    }

    .ot::before,
    .ot::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 24px;
      z-index: 2;
      pointer-events: none
    }

    .ot::before {
      left: 0;
      background: linear-gradient(90deg, var(--bg2), transparent)
    }

    .ot::after {
      right: 0;
      background: linear-gradient(270deg, var(--bg2), transparent)
    }

    .ot-t {
      display: flex;
      gap: 20px;
      animation: otS 40s linear infinite;
      white-space: nowrap;
      padding-left: 100%
    }

    .ot-i {
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--tx2)
    }

    .ot-i .ot-tt {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--tx);
      font-weight: 600
    }

    .ot-i .ot-p {
      font-weight: 700;
      font-variant-numeric: tabular-nums
    }

    .ot-i .ot-a {
      font-size: 10px;
      font-weight: 800
    }

    .ot-i .ot-a.up {
      color: var(--yes)
    }

    .ot-i .ot-a.down {
      color: var(--no)
    }

    @keyframes otS {
      from {
        transform: translateX(0)
      }

      to {
        transform: translateX(-100%)
      }
    }

    .views {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch
    }

    .view {
      display: none;
      min-height: 100%
    }

    .view.active {
      display: block
    }

    .btabs {
      display: flex;
      border-top: 1px solid var(--brd);
      background: var(--bg2);
      flex-shrink: 0;
      padding-bottom: var(--sb)
    }

    .btab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0 4px;
      color: var(--tx3);
      font-size: 9px;
      font-weight: 600;
      gap: 2px;
      position: relative;
      min-height: var(--tap)
    }

    .btab.active {
      color: var(--acc)
    }

    .btab .bi {
      font-size: 18px;
      line-height: 1
    }

    .btab .badge {
      position: absolute;
      top: 2px;
      right: calc(50% - 16px);
      background: var(--no);
      color: #fff;
      font-size: 8px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 8px;
      min-width: 14px;
      text-align: center
    }

    .search-wrap {
      padding: 10px 16px 4px
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg3);
      border: 1px solid var(--brd);
      border-radius: var(--r);
      padding: 0 12px;
      gap: 8px
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--tx);
      font-size: 13px;
      padding: 10px 0;
      outline: none
    }

    .search-box input::placeholder {
      color: var(--tx3)
    }

    .cat-strip {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      overflow-x: auto;
      scrollbar-width: none
    }

    .cat-strip::-webkit-scrollbar {
      display: none
    }

    .cat-pill {
      padding: 6px 12px;
      background: var(--bg3);
      border: 1px solid var(--brd);
      border-radius: 16px;
      color: var(--tx2);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0
    }

    .cat-pill.active {
      background: var(--tx);
      color: var(--bg);
      border-color: var(--tx)
    }

    .sponsored {
      margin: 8px 16px;
      padding: 14px;
      background: linear-gradient(135deg, rgba(240, 184, 0, .08), rgba(255, 136, 0, .08));
      border: 1px solid rgba(240, 184, 0, .3);
      border-radius: var(--rl);
      position: relative;
      cursor: pointer
    }

    .sponsored::after {
      content: 'SPONSORED · 2× PAYOUT';
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--gold);
      background: var(--gold2);
      padding: 2px 6px;
      border-radius: 4px
    }

    .sponsored .sp-brand {
      font-size: 10px;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: .5px
    }

    .sponsored .sp-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      padding-right: 110px
    }

    .sponsored .sp-desc {
      font-size: 11px;
      color: var(--tx2);
      line-height: 1.4;
      margin-bottom: 10px
    }

    .native-ad {
      margin: 8px 16px;
      padding: 14px;
      background: linear-gradient(135deg, rgba(91, 141, 239, .08), rgba(168, 85, 247, .08));
      border: 1px solid rgba(91, 141, 239, .2);
      border-radius: var(--rl);
      position: relative;
      cursor: pointer
    }

    .native-ad::after {
      content: 'AD · WATCH TO EARN';
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--acc);
      background: var(--acc2);
      padding: 2px 6px;
      border-radius: 4px
    }

    .native-ad .na-t {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px
    }

    .native-ad .na-d {
      font-size: 11px;
      color: var(--tx2);
      line-height: 1.4;
      margin-bottom: 8px
    }

    .native-ad .na-c {
      display: inline-block;
      padding: 6px 14px;
      background: var(--acc);
      color: #fff;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700
    }

    .featured {
      margin: 8px 16px 14px;
      padding: 16px;
      background: linear-gradient(135deg, var(--bg3), var(--bg4));
      border: 1px solid var(--brd2);
      border-radius: var(--rl);
      position: relative;
      overflow: hidden;
      cursor: pointer
    }

    .featured::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, var(--acc2), transparent);
      border-radius: 50%
    }

    .feat-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--gold);
      margin-bottom: 6px
    }

    .feat-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      position: relative
    }

    .feat-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--tx2);
      position: relative
    }

    .feat-prices {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      position: relative
    }

    .price-chip {
      flex: 1;
      padding: 10px;
      border-radius: var(--r);
      text-align: center
    }

    .price-chip.yes {
      background: var(--yes2);
      border: 1px solid rgba(0, 210, 106, .25)
    }

    .price-chip.no {
      background: var(--no2);
      border: 1px solid rgba(255, 68, 102, .25)
    }

    .price-chip .pl {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px
    }

    .price-chip.yes .pl {
      color: var(--yes)
    }

    .price-chip.no .pl {
      color: var(--no)
    }

    .price-chip .pv {
      font-size: 22px;
      font-weight: 800;
      margin-top: 2px;
      font-variant-numeric: tabular-nums
    }

    .price-chip.yes .pv {
      color: var(--yes)
    }

    .price-chip.no .pv {
      color: var(--no)
    }

    .sec-title {
      padding: 4px 16px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: var(--tx3);
      text-transform: uppercase
    }

    .mkt-list {
      padding: 0 16px 20px
    }

    .mkt-row {
      padding: 12px 0;
      border-bottom: 1px solid var(--brd);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer
    }

    .mkt-row:last-child {
      border-bottom: none
    }

    .mkt-star {
      font-size: 16px;
      color: var(--tx3);
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .mkt-star.on {
      color: var(--gold)
    }

    .mkt-info {
      flex: 1;
      min-width: 0
    }

    .mkt-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical
    }

    .mkt-sub {
      font-size: 10px;
      color: var(--tx3);
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap
    }

    .mkt-sub .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--tx3)
    }

    .mkt-spark {
      width: 52px;
      height: 24px;
      flex-shrink: 0
    }

    .mkt-price {
      text-align: right;
      min-width: 56px;
      flex-shrink: 0
    }

    .mkt-price .mp {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums
    }

    .mkt-price .ml {
      font-size: 9px;
      color: var(--tx3);
      font-weight: 600
    }

    .mkt-price .arrow {
      font-size: 10px;
      font-weight: 800;
      margin-left: 2px
    }

    .mkt-price .arrow.up {
      color: var(--yes)
    }

    .mkt-price .arrow.down {
      color: var(--no)
    }

    .flash-up {
      animation: flashUp .6s ease
    }

    .flash-down {
      animation: flashDown .6s ease
    }

    @keyframes flashUp {
      0% {
        color: var(--yes);
        text-shadow: 0 0 8px var(--yes)
      }

      100% {
        text-shadow: none
      }
    }

    @keyframes flashDown {
      0% {
        color: var(--no);
        text-shadow: 0 0 8px var(--no)
      }

      100% {
        text-shadow: none
      }
    }

    .utag {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 8px;
      font-weight: 700;
      margin-left: 3px;
      vertical-align: middle
    }

    .utag.alpha {
      background: var(--acc2);
      color: var(--acc)
    }

    .utag.beta {
      background: var(--purple2);
      color: var(--purple)
    }

    .utag.gamma {
      background: var(--gold2);
      color: var(--gold)
    }

    .vol-badge {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 8px;
      font-weight: 700;
      margin-left: 3px
    }

    .vol-badge.low {
      background: var(--yes2);
      color: var(--yes)
    }

    .vol-badge.med {
      background: var(--gold2);
      color: var(--gold)
    }

    .vol-badge.high {
      background: var(--no2);
      color: var(--no)
    }

    .det-header {
      padding: 16px;
      border-bottom: 1px solid var(--brd)
    }

    .back-btn {
      color: var(--acc);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .det-cat {
      font-size: 10px;
      color: var(--tx2);
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 4px
    }

    .det-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px
    }

    .det-desc {
      font-size: 12px;
      color: var(--tx2);
      line-height: 1.5;
      margin-bottom: 10px
    }

    .det-meta {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--tx2);
      flex-wrap: wrap
    }

    .det-meta b {
      color: var(--tx);
      font-weight: 600
    }

    .det-tabs {
      display: flex;
      border-bottom: 1px solid var(--brd);
      background: var(--bg2)
    }

    .det-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--tx3);
      border-bottom: 2px solid transparent
    }

    .det-tab.active {
      color: var(--tx);
      border-bottom-color: var(--acc)
    }

    .det-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px
    }

    .det-action {
      flex: 1;
      padding: 10px;
      background: var(--bg3);
      border: 1px solid var(--brd);
      border-radius: var(--r);
      color: var(--tx2);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px
    }

    .sentiment {
      margin: 12px 16px;
      padding: 12px;
      background: var(--bg3);
      border: 1px solid var(--brd);
      border-radius: var(--r)
    }

    .sentiment .s-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 8px
    }

    .sentiment .s-yes {
      color: var(--yes);
      font-weight: 700
    }

    .sentiment .s-no {
      color: var(--no);
      font-weight: 700
    }

    .sentiment .s-bar {
      height: 8px;
      background: var(--no);
      border-radius: 4px;
      overflow: hidden
    }

    .sentiment .s-fill {
      height: 100%;
      background: var(--yes);
      transition: width .5s;
      border-radius: 4px
    }

    .sentiment .s-traders {
      font-size: 10px;
      color: var(--tx3);
      margin-top: 6px;
      display: flex;
      justify-content: space-between
    }

    .sentiment .s-traders b {
      color: var(--tx)
    }

    .orderbook {
      margin: 12px 16px;
      padding: 12px;
      background: var(--bg3);
      border: 1px solid var(--brd);
      border-radius: var(--r)
    }

    .ob-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--tx3);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between
    }

    .ob-spread {
      text-align: center;
      font-size: 11px;
      color: var(--tx2);
      margin-bottom: 8px;
      padding: 4px;
      background: var(--bg);
      border-radius: 4px
    }

    .ob-spread b {
      color: var(--tx);
      font-weight: 700
    }

    .ob-row {
      display: flex;
      align-items: center;
      font-size: 11px;
      padding: 3px 0;
      position: relative;
      font-variant-numeric: tabular-nums
    }

    .ob-row .ob-bg {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 2px;
      opacity: .2
    }

    .ob-row.bid .ob-bg {
      background: var(--yes);
      right: 0
    }

    .ob-row.ask .ob-bg {
      background: var(--no);
      left: 0
    }

    .ob-row .ob-p {
      flex: 1;
      font-weight: 700;
      position: relative;
      z-index: 1
    }

    .ob-row.bid .ob-p {
      color: var(--yes)

        if (S._betAmt > S.d.balance) { UI.closeSlip(); UI.showToast('⚠️ Not enough chips — tap ▶ to earn more', 'lose'); setTimeout(() => this.openEarn(), 800); return }
        const pos = E.buy(m, S._selSide, S._betAmt);
        if (pos) { UI.closeSlip(); S._selSide = null; UI.renderDetail(); UI.showUndoToast(pos) }
      },
      undoBet() {
        if (!S._lastBet) return;
        const p = S.d.positions.find(x => x.id === S._lastBet.id);
        if (p && p.status === 'open') { S.d.balance += p.cost; const idx = S.d.positions.indexOf(p); if (idx >= 0) S.d.positions.splice(idx, 1); const hidx = S.d.betHistory.findIndex(h => h.posId === p.id); if (hidx >= 0) S.d.betHistory.splice(hidx, 1); UI.showToast('Bet undone', 'win'); UI.addAct(`↩️ Bet undone · +${U.fmt(p.cost)}`); save() }
        document.getElementById('undoToast').classList.remove('show'); clearInterval(S._undoTimer); S._lastBet = null;
        if (S._view === 'detail') UI.renderDetail(); else if (S._view === 'portfolio') UI.renderPortfolio();
      },
      cashout(id) { E.cashout(id); UI.renderPortfolio() },
      sellPos(id) {
        const p = S.d.positions.find(x => x.id === id); if (!p) return; const m = S.d.markets.find(x => x.id === p.mktId); if (!m) return;
        const cp = p.side === 'YES' ? m.yesPrice : (100 - m.yesPrice); const val = p.contracts * (cp / 100); const pl = val - p.cost;
        UI.openModal(`<h3>Sell Position</h3><p>${U.sanitize(m.title)}</p><div style="text-align:left;margin:12px 0"><div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--brd)"><span style="color:var(--tx2)">Side</span><span>${p.side}</span></div><div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--brd)"><span style="color:var(--tx2)">Value</span><span>${U.fmt(val)}</span></div><div style="display:flex;justify-content:space-between;padding:6px 0"><span style="color:var(--tx2)">P&L</span><span style="color:${pl >= 0 ? 'var(--yes)' : 'var(--no)'}">${pl >= 0 ? '+' : ''}${U.fmt(pl)}</span></div></div><button onclick="E.sell('${id}');UI.closeModal();UI.renderPortfolio()">Confirm Sell</button><button class="secondary" onclick="UI.closeModal()">Cancel</button>`);
      },
      setAlert(mktId) {
        const m = S.d.markets.find(x => x.id === mktId); if (!m) return;
        UI.openModal(`<h3>🔔 Set Price Alert</h3><p>Get notified when price hits your target.</p><div style="display:flex;gap:8px;margin:12px 0"><button class="qa" style="flex:1" onclick="S._alertCond='above';this.style.background='var(--yes)';this.style.color='#000'">Above</button><button class="qa" style="flex:1" onclick="S._alertCond='below';this.style.background='var(--no)';this.style.color='#fff'">Below</button></div><div style="margin:12px 0"><input type="number" id="alertTarget" value="${m.yesPrice}" min="1" max="99" style="width:100%;padding:12px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r);color:var(--tx);font-size:16px;text-align:center;font-weight:700"></div><button onclick="App._confirmAlert('${mktId}')">Set Alert</button><button class="secondary" onclick="UI.closeModal()">Cancel</button>`);
      },
      _confirmAlert(mktId) {
        const target = parseInt(document.getElementById('alertTarget').value);
        if (!target || target < 1 || target > 99) return;
        S.d.alerts.push({ mktId, cond: S._alertCond, target, message: `${S._alertCond === 'above' ? 'Above' : 'Below'} ${target}¢` });
        UI.showToast(`🔔 Alert set`, 'ach'); UI.addAct(`🔔 Alert set`); UI.closeModal(); save();
      },
      openEarn() { this.nav('earn') },
      watchMethod(id) {
        const method = EARN_METHODS.find(m => m.id === id); if (!method) return;
        const streakBonus = Ads.getStreakBonus();
        const reward = typeof method.reward === 'number' ? Math.round(method.reward * (1 + streakBonus / 100)) : null;
        if (id === 'sim') this._runAd(method, 5, reward || 25, 'Narrative Simulation');
        else if (id === 'video') this._runAd(method, 30, reward || 50, 'Video Ad');
        else if (id === 'survey') this._runAd(method, 20, reward || 75, 'Quick Survey');
        else if (id === 'wheel') this._runAd(method, 10, null, 'Bonus Wheel', () => this.openWheel(reward || 50));
        else if (id === 'playable') this._showPlayable(reward || 100);
        else if (id === 'lucky') this._runAd(method, 10, null, 'Lucky Draw', () => this.openLuckyDraw());
        else if (id === 'premium') this._runAd(method, 45, reward || 150, 'Premium Offer');
      },
      _runAd(method, duration, reward, label, onComplete) {
        const ch = U.rc(E.alive()); const u = UNIVERSES[ ch.universe ];
        const preview = `${ch.name} navigates the treacherous landscape of ${u.name}. Neon lights flicker across ancient stone as a dimensional rift crackles overhead. A choice must be made...`;
        UI.openModal(`<h3>${method.icon} ${label}</h3><div class="earn-notice">💡 <b>Free to play:</b> Watch this ${duration}s ${label.toLowerCase()} to earn chips. No purchase necessary.</div><div class="ad-preview">${preview}</div>${reward ? `<div class="reward-preview">🎁 Reward: +${U.fmt(reward)}${streakBonus > 0 ? ` <span style="font-size:11px;color:var(--gold)">(+$${Math.round(reward * streakBonus / 100)} streak)</span>` : ''}</div>` : ''}<div class="countdown" id="adCD">${duration}</div><button id="adBtn" disabled>Playing ${label.toLowerCase()}...</button>`);
        let t = duration; Ads.mark();
        const iv = setInterval(() => { t--; const el = document.getElementById('adCD'); const btn = document.getElementById('adBtn'); if (!el) { clearInterval(iv); return } if (t > 0) el.textContent = t; else { clearInterval(iv); el.textContent = '✓'; if (reward) { S.d.balance += reward; S.d.totalEarned = (S.d.totalEarned || C.BAL) + reward; S.d.earnSources[ method.id ] = (S.d.earnSources[ method.id ] || 0) + 1; UI.renderBal(); UI.addAct(`💰 Earned <b>${U.fmt(reward)}</b> from ${label}`) } btn.disabled = false; btn.textContent = reward ? `Collect ${U.fmt(reward)}` : 'Continue'; btn.onclick = () => { UI.closeModal(); if (reward) UI.showToast(`+${U.fmt(reward)}`, 'win'); if (onComplete) setTimeout(onComplete, 300); else if (S._view === 'earn') UI.renderEarn() } } }, 1000);
      },
      _showPlayable(reward) {
        const el = document.getElementById('playable');
        el.innerHTML = `<div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--tx3);margin-bottom:8px">PLAYABLE AD · EARN ${U.fmt(reward)}</div><div style="font-size:14px;font-weight:700;margin-bottom:4px">🎮 Tap the Targets!</div><div style="font-size:11px;color:var(--tx2);margin-bottom:4px">Hit 10 targets in 15 seconds</div><div style="font-size:10px;color:var(--yes);margin-bottom:8px">💡 Free reward · No purchase necessary</div><div class="play-score" id="playScore">0 / 10</div><div class="play-timer" id="playTimer">15s</div><div class="play-area" id="playArea"></div><button id="playBtn" onclick="App._startPlayable(${reward})">Start</button>`;
        el.classList.add('show'); Ads.mark();
      },
      _startPlayable(reward) {
        const area = document.getElementById('playArea'); let score = 0, time = 15;
        document.getElementById('playBtn').style.display = 'none';
        const spawnTarget = () => { const t = document.createElement('div'); t.className = 'play-target'; t.style.left = U.ri(10, 220) + 'px'; t.style.top = U.ri(10, 300) + 'px'; t.textContent = U.rc([ '💎', '⭐', '🎯', '💰', '🔥' ]); t.onclick = () => { score++; document.getElementById('playScore').textContent = `${score} / 10`; area.removeChild(t); if (score >= 10) endGame(true) }; area.appendChild(t); setTimeout(() => { if (t.parentNode) area.removeChild(t) }, 2000) };
        const spawner = setInterval(spawnTarget, 700);
        const timer = setInterval(() => { time--; const el = document.getElementById('playTimer'); if (!el) { clearInterval(timer); clearInterval(spawner); return } el.textContent = time + 's'; if (time <= 0) { clearInterval(timer); clearInterval(spawner); endGame(score >= 10) } }, 1000);
        const endGame = (won) => { clearInterval(spawner); clearInterval(timer); area.innerHTML = ''; if (won) { S.d.balance += reward; S.d.totalEarned = (S.d.totalEarned || C.BAL) + reward; UI.renderBal(); UI.addAct(`💰 Earned <b>${U.fmt(reward)}</b> from playable ad`); area.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column"><div style="font-size:48px">🎉</div><div style="font-size:20px;font-weight:800;color:var(--gold);margin-top:8px">+${U.fmt(reward)}</div></div>` } else { area.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column"><div style="font-size:48px">😢</div><div style="font-size:14px;color:var(--tx2);margin-top:8px">Try again next time!</div></div>` } setTimeout(() => { document.getElementById('playable').classList.remove('show'); UI.showToast(won ? `+${U.fmt(reward)}` : 'Nice try!', 'win'); if (S._view === 'earn') UI.renderEarn() }, 2000) };
      },
      openWheel(baseReward) {
        const segs = [ 2, 3, 5, 2, 10, 3, 2, 5 ]; const colors = [ 'var(--yes)', 'var(--acc)', 'var(--gold)', 'var(--yes)', 'var(--purple)', 'var(--acc)', 'var(--yes)', 'var(--gold)' ];
        let grad = 'conic-gradient('; let acc = 0; segs.forEach((s, i) => { const start = acc; acc += 360 / segs.length; grad += `${colors[ i ]} ${start}deg ${acc}deg,` }); grad = grad.slice(0, -1) + ')';
        UI.openModal(`<h3>🎡 Bonus Wheel</h3><div class="earn-notice">💡 <b>Free reward:</b> Spin for a 2×–10× multiplier on ${U.fmt(baseReward)}. No purchase necessary.</div><div class="wheel-wrap"><div class="wheel-pointer"></div><div class="wheel" id="wheel" style="background:${grad}"></div><div class="wheel-center">🎯</div></div><div class="wheel-result" id="wheelRes" style="display:none"></div><button id="wheelBtn" onclick="App._spinWheel(${baseReward})">Spin</button><button class="secondary" onclick="UI.closeModal()">Close</button>`);
      },
      _spinWheel(baseReward) {
        const segs = [ 2, 3, 5, 2, 10, 3, 2, 5 ]; const wheel = document.getElementById('wheel'); const btn = document.getElementById('wheelBtn');
        btn.disabled = true; btn.textContent = 'Spinning...';
        const winIdx = U.ri(0, segs.length - 1); const segAngle = 360 / segs.length; const targetAngle = 360 * 5 + (360 - winIdx * segAngle - segAngle / 2);
        wheel.style.transform = `rotate(${targetAngle}deg)`;
        setTimeout(() => { const mult = segs[ winIdx ]; const reward = baseReward * mult; S.d.balance += reward; S.d.totalEarned = (S.d.totalEarned || C.BAL) + reward; UI.renderBal(); const res = document.getElementById('wheelRes'); res.style.display = 'block'; res.style.color = 'var(--gold)'; res.textContent = `🎉 ${mult}× · +${U.fmt(reward)}`; UI.addAct(`🎡 Wheel: <b>${mult}× = ${U.fmt(reward)}</b>`); btn.textContent = `Collect ${U.fmt(reward)}`; btn.disabled = false; btn.onclick = () => { UI.closeModal(); UI.showToast(`+${U.fmt(reward)}`, 'win'); if (S._view === 'earn') UI.renderEarn() } }, 4200);
      },
      openLuckyDraw() {
        const prizes = [ 10, 25, 50, 100, 25, 50, 10, 200, 50 ]; const shuffled = [ ...prizes ].sort(() => Math.random() - .5);
        let h = `<h3>🎰 Lucky Card Draw</h3><div class="earn-notice">💡 <b>Free reward:</b> Pick a card to reveal your prize ($10–$200). No purchase necessary.</div><div class="lucky-grid">`;
        for (let i = 0; i < 9; i++)h += `<div class="lucky-card" onclick="App._flipLucky(this,${shuffled[ i ]})"><span style="font-size:24px">?</span></div>`;
        h += `</div><button class="secondary" onclick="UI.closeModal()">Skip</button>`;
        UI.openModal(h);
      },
      _flipLucky(el, prize) {
        if (el.classList.contains('flipped')) return;
        document.querySelectorAll('.lucky-card').forEach(c => { c.style.pointerEvents = 'none'; if (!c.classList.contains('flipped')) c.innerHTML = `<span class="lc-val">${U.rc([ 10, 25, 50 ])}</span>` });
        el.classList.add('flipped'); el.innerHTML = `<span class="lc-val">${prize}</span>`;
        S.d.balance += prize; S.d.totalEarned = (S.d.totalEarned || C.BAL) + prize; UI.renderBal(); UI.addAct(`🎰 Lucky Draw: <b>+${U.fmt(prize)}</b>`);
        setTimeout(() => { UI.closeModal(); UI.showToast(`+${U.fmt(prize)}`, 'win'); if (S._view === 'earn') UI.renderEarn() }, 1500);
      },
      openSettings() {
        UI.openModal(`<h3>⚙️ Settings</h3><div style="background:var(--yes2);border:1px solid rgba(0,210,106,.3);border-radius:var(--r);padding:10px;margin:12px 0;font-size:11px;color:var(--yes);line-height:1.5;text-align:left"><b>💡 Free to Play Notice:</b><br>WagerTale is 100% free. All chips are earned by watching ads and completing offers. <b>No real money is ever exchanged.</b> Chips cannot be purchased with real currency, cashed out, or converted to real value. This app is for entertainment only.</div><div style="text-align:left;padding:10px 0;font-size:12px;color:var(--tx2);line-height:1.6"><div style="display:flex;justify-content:space-between;padding:4px 0"><span>Version</span><b>${C.VER}</b></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>Ads watched</span><b>${Ads._count}</b></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>Day streak</span><b>${Ads._streak} 🔥</b></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>Total chips earned</span><b>${U.fmt(S.d.totalEarned || C.BAL)}</b></div><div style="display:flex;justify-content:space-between;padding:4px 0"><span>Real money spent</span><b style="color:var(--yes)">$0.00</b></div></div><button class="danger" onclick="if(confirm('Reset all data?')){localStorage.removeItem('${C.KEY}');location.reload()}">Reset Data</button><button class="secondary" onclick="UI.closeModal()">Close</button>`);
      },
      closeModal() { UI.closeModal() }
    };
    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>

</html>
